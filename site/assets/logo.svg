  <g clip-path="url(#globe)" fill="none" stroke="#DCFCE7" stroke-opacity=".55" stroke-width="2.5">
    <ellipse cx="64" cy="84" rx="17" ry="38"/>
    <path d="M24 64 Q64 74 104 64"/>
    <path d="M24 104 Q64 114 104 104"/>
