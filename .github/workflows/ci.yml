name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            # Surface the failures as annotations, readable without the logs.
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  # Windows: the module builds and its unit tests run, but lockhttp itself
  # (gate and console) refuses to run there and no Windows binary is
  # released. Test files that need Unix accounts, file modes, sockets or
  # terminals carry `//go:build unix`; single tests skip with a reason.
  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      # Keep LF line endings: fixtures and golden text are compared byte
      # for byte.
      - name: git line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  lint:
    name: lint (hygiene, gofmt, staticcheck, govulncheck, goreleaser check)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hygiene (no internal names in tracked files)
        run: sh scripts/hygiene.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check

  # The gate, the console and their upstreams run in-process: the harness in
  # test/integration starts them on 127.0.0.1 and stops them when the test
  # binary exits. No Docker service is needed.
  integration:
    name: integration (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go test -tags integration
        run: go test -tags integration -count=1 -timeout 15m ./test/integration/...
