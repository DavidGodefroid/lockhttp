# GoReleaser configuration for lockhttp.
#
# Local dry run (no signing, no publishing):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=sign
#
# A tag v* pushed to GitHub runs .github/workflows/release.yml, which needs
# cosign and syft on PATH.
version: 2

project_name: lockhttp

before:
  hooks:
    - go mod download

# The gate and the console are Unix-only: linux and darwin, no windows.
builds:
  - id: lockhttp
    main: ./cmd/lockhttp
    binary: lockhttp
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: lockhttp
    ids: [lockhttp]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Explicit list: docs/ also holds local-only material that must never ship.
    files:
      - LICENSE
      - NOTICE
      - README.md
      - CHANGELOG.md
      - SECURITY.md

# Linux packages, attached to the release and covered by checksums.txt. The
# binary lands in /usr/bin, owned by root, which is what `lockhttp doctor`
# expects.
nfpms:
  - id: packages
    ids: [lockhttp]
    package_name: lockhttp
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    vendor: David Godefroid
    maintainer: David Godefroid <noreply@github.com>
    homepage: https://github.com/DavidGodefroid/lockhttp
    description: Human-gated outbound HTTP for AI agents
    license: Apache-2.0
    contents:
      - src: LICENSE
        dst: /usr/share/doc/lockhttp/LICENSE
        file_info:
          mode: 0644
      - src: NOTICE
        dst: /usr/share/doc/lockhttp/NOTICE
        file_info:
          mode: 0644

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign signature of the checksum file (GitHub OIDC in CI). Verify
# with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/DavidGodefroid/lockhttp/\.github/workflows/release\.yml@refs/tags/v[0-9]' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    output: true

# One SPDX SBOM per archive, generated by syft.
sboms:
  - id: archives
    artifacts: archive

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: DavidGodefroid
    name: lockhttp
  # Every release is a GitHub pre-release until v1.0.0 (`auto` would publish
  # v0.1.0 as a full release). Switch back to `auto` at v1.0.0.
  prerelease: true
  draft: false
